name: Publish Python package

# Builds the wheel/sdist from python/ and uploads spark-cell-runner to PyPI
# on tags like python-v0.7.0, or on demand. Requires the PYPI_API_TOKEN
# repository secret (a PyPI API token, username-scoped to the project).
# Alternative: set the project up as a Trusted Publisher at
# https://pypi.org/manage/account/publishing/ and delete the `password:`
# line below — the id-token: permission is already in place for it.

on:
  workflow_dispatch:
  push:
    tags:
      - 'python-v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      # For PyPI trusted publishing (unused when PYPI_API_TOKEN is set).
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build tooling
        run: python -m pip install --upgrade build twine

      - name: Run the test suite
        run: |
          python -m pip install -e "python[dev]"
          python -m pytest python/tests -q

      - name: Build sdist and wheel
        run: python -m build --outdir dist python

      - name: Check the distributions
        run: twine check dist/*

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}

      - name: Attach the distributions to a GitHub release
        if: startsWith(github.ref, 'refs/tags/python-v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.whl
            dist/*.tar.gz
          generate_release_notes: true
