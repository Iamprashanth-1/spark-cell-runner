name: Publish to PyPI

on:
  push:
    tags:
      - 'v*.*.*'  # Triggers when you push a new release tag like 'v0.7.0'

jobs:
  build-and-publish:
    name: Build and publish Python package
    runs-on: ubuntu-latest

    # These permissions are required for PyPI Trusted Publishing
    permissions:
      id-token: write  # Mandatory for OIDC authentication
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build

      # The package lives in python/ (pyproject.toml is not at the repo root).
      - name: Build package
        working-directory: python
        run: python -m build

      - name: Publish package to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: python/dist
